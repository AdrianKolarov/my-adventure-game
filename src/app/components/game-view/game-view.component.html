

<div class="stage" [style.background-image]="backgroundUrl" (click)="advanceDialog()">
<button class="btn btn-dark" (click)="toggleInventory()">Inventory</button>
<button class="btn btn-red" (click)="exitToList()">Exit</button>
<div class="portrait-frame">
      <img [src]="portraitUrl" class="portrait" alt="Character portrait" />
    </div>
 
<div class="dialogue-box">
    
    <div class="dialogue-text">
      <p>{{ currentLine }}</p>
    </div>
  </div>

  <div class="choices" *ngIf="allDialogShown()">
    <button *ngFor="let choice of filteredChoices" (click)="makeChoice(choice)">
      {{ choice }}
    </button>
  </div>
</div>


<div *ngIf="showDeathNoteModal" class="modal-backdrop">
  <div class="modal">
    <h2>Write a Death Note</h2>
    <textarea [(ngModel)]="deathNoteText" rows="5" placeholder="Your final words..."></textarea>
    <button class="btn btn-accent" (click)="submitDeathNote()">Submit</button>
  </div>
</div>


<div *ngIf="showInventoryModal" class="modal-backdrop">
  <div class="modal modal-inventory">
    <h2>Character Inventory</h2>

    <div *ngIf="character" class="inventory-grid">
      <aside class="inventory-aside">
        <div class="portrait-card">
          <img [attr.src]="portraitUrl || null" class="portrait-inventory" alt="Character portrait" />
          <div class="char-name">Name: {{ character.name }}</div>
          <div class="char-gender">{{ character.gender }}</div>
        </div>
      </aside>

      <section class="inventory-main">
        <h3 class="section-title">Stats</h3>
        <ul class="stat-list">
          <li *ngFor="let stat of statKeys">
            <span class="stat-key">{{ stat }}</span>
            <span class="stat-val">{{ character.stats[stat] }}</span>
          </li>
        </ul>

        <h3 class="section-title">Inventory</h3>
        <ul class="item-list">
          <li *ngFor="let item of character.inventory">{{ item }}</li>
        </ul>
      </section>
    </div>

    <div class="actions-row">
      <button class="btn btn-dark" (click)="toggleInventory()">Close</button>
    </div>
  </div>
</div>
